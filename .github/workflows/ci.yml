name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same ref are cancelled — saves runner minutes on
# rapid successive pushes to a PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # No later step needs git credentials — don't leave the token in
          # .git/config while pip build hooks and the test suite execute.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Mirrors the Dockerfile runtime apt set, minus zeek (external OBS repo;
      # zeek-dependent e2e tests also need pcap samples that aren't checked in,
      # so they skip in CI either way):
      # - tshark: packet parsing (pulls wireshark-common + libpcap)
      # - libpango/cairo/gdk-pixbuf/mime/fonts: WeasyPrint PDF test suite
      # (kaleido 0.2.1 bundles its own headless Chromium — no system browser)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tshark \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=58

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory only: a discovered CVE surfaces here without blocking merges.
    # The required check for branch protection stays `test`.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

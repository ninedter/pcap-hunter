# Local workbench, authenticated API, and isolated offline agent worker.
services:
  pcap-hunter-ui:
    build: {context: ., target: runtime}
    image: ${PCAP_HUNTER_IMAGE:-pcap-hunter:latest}
    command: ["uvicorn", "app.web.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8501"]
    # Retained for the first legacy-key migration. New random keys survive hostname changes.
    hostname: pcap-hunter
    ports: ["127.0.0.1:8501:8501"]
    environment:
      LM_BASE_URL: "${LM_BASE_URL:-http://host.docker.internal:1234/v1}"
      PCAP_HUNTER_DOCKER_HOST_FALLBACK: "1"
      PCAP_HUNTER_PRESERVE_SAVED_DATA: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${PCAP_HUNTER_DATA_BIND:-./data}:/app/data
      - pcap-hunter-home:/home/runner
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=1g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    init: true
    restart: unless-stopped

  pcap-hunter-api:
    image: ${PCAP_HUNTER_IMAGE:-pcap-hunter:latest}
    command: ["uvicorn", "app.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    hostname: pcap-hunter
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PCAP_HUNTER_API_KEY: "${PCAP_HUNTER_API_KEY:-}"
      PCAP_HUNTER_FEED_KEY: "${PCAP_HUNTER_FEED_KEY:-}"
      # Allows a fail-closed API to start before the local analyst creates an agent key.
      PCAP_HUNTER_AGENT_MODE: "1"
      PCAP_HUNTER_HEALTH_PORT: "8000"
      PCAP_HUNTER_AGENT_INPUT: /agent-inbox
      PCAP_HUNTER_AGENT_OUTPUT: /agent-results
      LM_BASE_URL: "${LM_BASE_URL:-http://host.docker.internal:1234/v1}"
      PCAP_HUNTER_DOCKER_HOST_FALLBACK: "1"
      PCAP_HUNTER_PRESERVE_SAVED_DATA: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${PCAP_HUNTER_DATA_BIND:-./data}:/app/data
      - pcap-hunter-home:/home/runner
      - pcap-hunter-agent-input:/agent-inbox
      - pcap-hunter-agent-output:/agent-results:ro
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=1g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    init: true
    depends_on: [pcap-hunter-ui]
    restart: unless-stopped

  # Trusted launcher only. Packet parsers run in separate, disposable job containers.
  pcap-hunter-agent-worker:
    image: ${PCAP_HUNTER_IMAGE:-pcap-hunter:latest}
    command: ["python", "-m", "app.agents.supervisor"]
    environment:
      PCAP_HUNTER_AGENT_INPUT: /agent-inbox
      PCAP_HUNTER_AGENT_OUTPUT: /agent-results
      PCAP_HUNTER_JOB_IMAGE: ${PCAP_HUNTER_IMAGE:-pcap-hunter:latest}
      PCAP_HUNTER_AGENT_INPUT_VOLUME: ${COMPOSE_PROJECT_NAME:-pcap-hunter}_pcap-hunter-agent-input
      PCAP_HUNTER_RUNNER_OWNER: ${COMPOSE_PROJECT_NAME:-pcap-hunter}
    # This control-plane service has Docker administration access. Never expose its socket to parsers/API/UI.
    group_add: ["${DOCKER_GID:-0}"]
    network_mode: none
    volumes:
      - pcap-hunter-agent-input:/agent-inbox:ro
      - pcap-hunter-agent-output:/agent-results
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
      - /app/data:rw,nosuid,nodev,size=32m,uid=1000,gid=1000
      - /home/runner:rw,nosuid,nodev,size=32m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/agent-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<15"]
      interval: 15s
      timeout: 3s
      start_period: 15s
    restart: unless-stopped

volumes:
  pcap-hunter-home:
  pcap-hunter-agent-input:
  pcap-hunter-agent-output:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=1000,gid=1000,mode=0700

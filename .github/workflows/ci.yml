name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rebuild and rescan the default branch when nobody pushes, so new advisories
  # against the pinned native components surface without a code change. Twice a
  # week rather than once: GitHub evicts Actions caches that go unread for 7 days,
  # and an exactly-weekly run would race that eviction of the native build cache.
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Scheduled runs get their own group so they never cancel (or get cancelled by)
  # the gate run for a push to main, which shares the same ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true
jobs:
  # Minutes-scale feedback that does not wait for the native image build. The
  # canonical image still runs Ruff and the frontend tests itself; this job only
  # reports the cheap failures early and additionally lints scripts/.
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the lock-pinned Ruff
        run: |
          # Take the exact version and hashes from the reviewed test lock, so this
          # job can never lint with a different Ruff than the canonical image.
          awk '/^ruff==/{found=1} found{print} found && !/\\$/{exit}' requirements-test.lock > "$RUNNER_TEMP/ruff.lock"
          grep -q '^ruff==' "$RUNNER_TEMP/ruff.lock"
          python3 -m venv "$RUNNER_TEMP/ruff-venv"
          "$RUNNER_TEMP/ruff-venv/bin/python" -m pip install --disable-pip-version-check --no-deps --require-hashes -r "$RUNNER_TEMP/ruff.lock"
          "$RUNNER_TEMP/ruff-venv/bin/ruff" --version
      - name: Ruff format check
        run: |
          "$RUNNER_TEMP/ruff-venv/bin/ruff" format --check .
      - name: Ruff lint
        run: |
          "$RUNNER_TEMP/ruff-venv/bin/ruff" check .
      - name: Frontend build and unit tests
        working-directory: prototype-friendly-ui
        run: |
          node --version
          npm ci
          # sites-worker.test.mjs asserts on the build output, so build first.
          npm run build
          npm run test:ui

  platform-test:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDK space for native builds
        run: |
          # These preinstalled SDKs are not used by this Linux container project.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /
      - name: Record native runner identity
        run: |
          mkdir -p .ci-evidence
          test "$(uname -m)" = "${{ matrix.machine }}"
          uname -a > .ci-evidence/runner.txt
          docker version >> .ci-evidence/runner.txt
          git rev-parse HEAD > .ci-evidence/tested-commit.txt
      - name: Set up native Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Size the Zeek source build to the runner
        id: build-jobs
        run: |
          # The Dockerfile default (2) suits small local machines; hosted runners have more cores.
          echo "zeek=$(nproc)" >> "$GITHUB_OUTPUT"
      - name: Build canonical test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: test
          tags: pcap-hunter:test
          load: true
          build-args: |
            ZEEK_BUILD_JOBS=${{ steps.build-jobs.outputs.zeek }}
          cache-from: type=gha,scope=pcap-hunter-${{ matrix.arch }}
          cache-to: type=gha,scope=pcap-hunter-${{ matrix.arch }},mode=max
      - name: Python checks and offline PDF/security tests
        run: docker run --rm --network none --no-healthcheck pcap-hunter:test
      - name: Build frontend and test browser logic
        run: |
          docker buildx build --load --platform ${{ matrix.platform }} --target web-builder -t pcap-hunter:web-test .
          docker run --rm \
            -v "$GITHUB_WORKSPACE/prototype-friendly-ui/tests:/web/tests:ro" \
            -v "$GITHUB_WORKSPACE/prototype-friendly-ui/scripts:/web/scripts:ro" \
            -v "$GITHUB_WORKSPACE/prototype-friendly-ui/worker:/web/worker:ro" \
            -v "$GITHUB_WORKSPACE/prototype-friendly-ui/.openai:/web/.openai:ro" \
            --entrypoint sh pcap-hunter:web-test -c 'npm run build && npm run test:ui && npm audit --omit=dev'
      - name: Build runtime candidate
        env:
          ZEEK_BUILD_JOBS: ${{ steps.build-jobs.outputs.zeek }}
        run: |
          # The build arg is part of the Zeek layer's cache key: it must match the
          # test-image build above or this step recompiles Zeek from source.
          docker buildx build --load --platform ${{ matrix.platform }} --target runtime \
            --build-arg "ZEEK_BUILD_JOBS=$ZEEK_BUILD_JOBS" -t pcap-hunter:candidate .
      - name: Real per-job filesystem, process and network isolation controls
        run: |
          socket_gid=$(stat -c '%g' /var/run/docker.sock)
          docker run --rm --network none --group-add "$socket_gid" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e PCAP_HUNTER_TEST_IMAGE=pcap-hunter:candidate \
            --entrypoint python pcap-hunter:test tests/acceptance/worker_isolation.py
      - name: Verify patched native and bundled components
        run: |
          test "$(docker image inspect pcap-hunter:candidate --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker image inspect pcap-hunter:candidate --format '{{.Id}}' > .ci-evidence/runtime-image.txt
          docker run --rm --network none pcap-hunter:candidate python /usr/share/pcap-hunter/verify_runtime.py > .ci-evidence/native-runtime.json
          cat .ci-evidence/native-runtime.json
      - name: Actual offline parser, chart and PDF controls
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$GITHUB_WORKSPACE/tests/fixtures:/fixtures:ro" \
            -v "$GITHUB_WORKSPACE/tests/acceptance/native_runtime.py:/native-runtime.py:ro" \
            --entrypoint python pcap-hunter:candidate /native-runtime.py > .ci-evidence/native-controls.json
          cat .ci-evidence/native-controls.json
      - name: Scan resolved runtime and generate SBOM
        run: |
          mkdir -p .ci-evidence
          cp docker/native-components.json .ci-evidence/
          TRIVY_IMAGE=aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" -v "$PWD/.ci-evidence:/results" "$TRIVY_IMAGE" image --scanners vuln,secret,misconfig --image-config-scanners misconfig,secret --format json --output /results/runtime-scan.json pcap-hunter:candidate
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" -v "$PWD/.ci-evidence:/results" "$TRIVY_IMAGE" image --format cyclonedx --output /results/sbom.json pcap-hunter:candidate
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 pcap-hunter:candidate
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" image --scanners secret --exit-code 1 pcap-hunter:candidate
      - name: Require complete release evidence
        run: |
          for file in runner.txt tested-commit.txt runtime-image.txt native-runtime.json native-controls.json runtime-scan.json sbom.json native-components.json; do
            test -s ".ci-evidence/$file"
          done
      - name: Retain complete scan results including unfixed advisories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-security-evidence-${{ matrix.arch }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Preserve the required check name while requiring both native platform jobs
  # (and the quick checks, which cover paths the image does not lint).
  test:
    needs: [quick, platform-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform gate
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
          PLATFORM_RESULT: ${{ needs.platform-test.result }}
        run: |
          test "$QUICK_RESULT" = success
          test "$PLATFORM_RESULT" = success
